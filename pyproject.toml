[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leash"
dynamic = ["version"]
description = "Control API for the LumenPnP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MPLv2"}
keywords = []
authors = [
  { name = "Stephen Hawes", email = "sphawes@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pyserial",
  "opencv-python",
  "ruff>=0.12.2",
]

[project.urls]
Documentation = "https://github.com/unknown/leash#readme"
Issues = "https://github.com/unknown/leash/issues"
Source = "https://github.com/unknown/leash"

[tool.hatch.version]
path = "src/leash/__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]>=7.9.2",
  "pytest",
  "pyserial",
  "opencv-python",
  "numpy"
]

[tool.hatch.envs.default.scripts]
leash = "python3 -m src.leash.__init__"
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12"]

[tool.hatch.envs.types]
dependencies = [
  "mypy>=1.16.1",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/leash tests}"

[tool.coverage.run]
source_pkgs = ["leash", "tests"]
branch = true
parallel = true
omit = [
  "src/leash/__about__.py",
]

[tool.coverage.paths]
leash = ["src/leash", "*/leash/src/leash"]
tests = ["tests", "*/leash/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]

# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "D211", # one-blank-line-before-class
    "D213", # multi-line-summary-second-line
    # Ignored because of using formatter
    "COM812", # missing-trailing-comma
    "D203", # one-blank-line-before-class
    "ISC001", # single-line-implicit-string-concatenation
    ]

[tool.ruff.lint.extend-per-file-ignores]
"**/*_test.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
